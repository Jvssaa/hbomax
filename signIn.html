<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBO Login</title>
    <link rel="stylesheet" href="assets/css/signin.css">
</head>

<body>

    <header>
        <a href="index.html"><img src="assets/images/hbo-logo.svg" alt=""></a>
        <div class="header-nav">
            <a href="signIn.html">ENTRAR</a>
            <a href="#assine">ASSINE AGORA</a>
        </div>
    </header>

    <main>
        <h1>ENTRAR</h1>
        <p>Você tem uma conta da HBO Max?</p>
        <form action="login">
            <input type="email" name="email" id="email" placeholder="Endereco de e-mail">
            <input type="password" name="password" id="password" minlength="8" placeholder="Senha">
            <button type="submit" class="botao-gradiente">ENTRAR</button>
            <a href="#" id="recover-password">Esqueceu a senha?</a>
        </form>
    </main>

    <footer>
        <div id="footer-links">
            <a href="" class="footer-links-item">AGORA NA HBO MAX</a>
            <a href="" class="footer-links-item">EM BREVE</a>
            <a href="" class="footer-links-item">FILME EM DESTAQUE</a>
            <a href="" class="footer-links-item">SERIES</a>
            <a href="" class="footer-links-item">AJUDA</a>
        </div>
        <div><span>© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob
                licença.</span></div>

        <div id="footer-logos">
            <a href="#">
                <img src="assets/images/fb_0.png" alt="" class="footer-logos-item">
            </a>
            <a href="#">
                <img src="assets/images/twitter_0.png" alt="" class="footer-logos-item">
            </a>
            <a href="#">
                <img src="assets/images/instagram_0.png" alt="" class="footer-logos-item">
            </a>
            <a href="#">
                <img src="assets/images/youtube_0.png" alt="" class="footer-logos-item">
            </a>
        </div>
    </footer>

</body>

</html>
